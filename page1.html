<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sample Application - Step 1</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0B7A2F,#2563EB);
padding:8px;
min-height:100vh;
}

.container{
width:100%;
max-width:430px;
margin:auto;
background:#fff;
border-radius:18px;
overflow:hidden;
box-shadow:0 12px 28px rgba(0,0,0,.2);
}

.header{
background:linear-gradient(135deg,#0B7A2F,#2563EB);
color:#fff;
text-align:center;
padding:24px 18px;
}

.header h1{
font-size:26px;
margin-bottom:6px;
}

.header p{
font-size:15px;
}

.progress{
height:6px;
background:rgba(255,255,255,.25);
margin-top:14px;
border-radius:8px;
overflow:hidden;
}

.progress span{
display:block;
width:33%;
height:100%;
background:#fff;
}

.content{
padding:18px;
}

.field{
margin-bottom:16px;
}

label{
display:flex;
align-items:center;
gap:10px;
margin-bottom:7px;
font-size:16px;
font-weight:700;
color:#1F2937;
}

.icon{
font-size:24px;
width:30px;
text-align:center;
}

input,select{
width:100%;
padding:14px;
font-size:16px;
border:1.5px solid #D1D5DB;
border-radius:12px;
background:#fff;
}

input:focus,
select:focus{
outline:none;
border-color:#2563EB;
box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

button{
width:100%;
padding:15px;
margin-top:8px;
border:none;
border-radius:14px;
background:linear-gradient(135deg,#2563EB,#1D4ED8);
color:#fff;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.footer{
text-align:center;
padding:16px;
font-size:14px;
font-weight:600;
color:#0B7A2F;
background:#F8FAFC;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🇰🇪🇰🇪NYOTA FUND KENYA🇰🇪🇰🇪</h1>
<p>Phase 2 Application - Step 1</p>

<div class="progress">
<span></span>
</div>
</div>

<div class="content">

<form id="applicationForm">

<div class="field">
<label><span class="icon">👤</span>Full Name *</label>
<input type="text" name="fullname" placeholder="Jane Wanjiku Kamau" required>
</div>

<div class="field">
<label><span class="icon">📞</span>Phone Number *</label>
<input type="tel" name="phone" placeholder="0712345678" required>
</div>

<div class="field">
<label><span class="icon">🪪</span>ID Number *</label>
<input type="text" name="id_number" placeholder="12345678" inputmode="numeric" required>
</div>

<div class="field">
<label><span class="icon">💼</span>Occupation *</label>
<select name="occupation" required>
<option value="">Select Occupation</option>
<option>Student</option>
<option>Business Owner</option>
<option>Self Employed</option>
<option>Employed</option>
<option>Farmer</option>
<option>Teacher</option>
<option>Doctor</option>
<option>Nurse</option>
<option>Engineer</option>
<option>Software Developer</option>
<option>Accountant</option>
<option>Lawyer</option>
<option>Driver</option>
<option>Mechanic</option>
<option>Electrician</option>
<option>Plumber</option>
<option>Carpenter</option>
<option>Welder</option>
<option>Tailor</option>
<option>Hairdresser / Barber</option>
<option>Trader</option>
<option>Salesperson</option>
<option>Hotel Attendant</option>
<option>Chef / Cook</option>
<option>Security Guard</option>
<option>Police Officer</option>
<option>Military Officer</option>
<option>Journalist</option>
<option>Graphic Designer</option>
<option>Photographer</option>
<option>Freelancer</option>
<option>Content Creator</option>
<option>Casual Worker</option>
<option>Unemployed</option>
<option>Retired</option>
<option>Other</option>
</select>
</div>

<div class="field">
<label><span class="icon">🌍</span>County *</label>
<select name="county" required>
<option value="">Select County</option>
<option>Baringo</option>
<option>Bomet</option>
<option>Bungoma</option>
<option>Busia</option>
<option>Elgeyo-Marakwet</option>
<option>Embu</option>
<option>Garissa</option>
<option>Homa Bay</option>
<option>Isiolo</option>
<option>Kajiado</option>
<option>Kakamega</option>
<option>Kericho</option>
<option>Kiambu</option>
<option>Kilifi</option>
<option>Kirinyaga</option>
<option>Kisii</option>
<option>Kisumu</option>
<option>Kitui</option>
<option>Kwale</option>
<option>Laikipia</option>
<option>Lamu</option>
<option>Machakos</option>
<option>Makueni</option>
<option>Mandera</option>
<option>Marsabit</option>
<option>Meru</option>
<option>Migori</option>
<option>Mombasa</option>
<option>Murang'a</option>
<option>Nairobi</option>
<option>Nakuru</option>
<option>Nandi</option>
<option>Narok</option>
<option>Nyamira</option>
<option>Nyandarua</option>
<option>Nyeri</option>
<option>Samburu</option>
<option>Siaya</option>
<option>Taita Taveta</option>
<option>Tana River</option>
<option>Tharaka-Nithi</option>
<option>Trans Nzoia</option>
<option>Turkana</option>
<option>Uasin Gishu</option>
<option>Vihiga</option>
<option>Wajir</option>
<option>West Pokot</option>
</select>
</div>

<button type="submit">Continue to Step 2 →</button>

</form>

</div>

<div class="footer">
🇰🇪🇰🇪NYOTA FUND KENYA🇰🇪🇰🇪
</div>

</div>

<script>
document.getElementById("applicationForm").addEventListener("submit",function(e){
e.preventDefault();

localStorage.setItem("fullname",this.fullname.value);
localStorage.setItem("phone",this.phone.value);
localStorage.setItem("id_number",this.id_number.value);
localStorage.setItem("occupation",this.occupation.value);
localStorage.setItem("county",this.county.value);

window.location.href="page2.html";
});
</script>

</body>
                 </html>
